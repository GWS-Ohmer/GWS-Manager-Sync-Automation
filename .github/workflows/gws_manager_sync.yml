name: GWS Manager Sync Automation

on:
  schedule:
    # 5:00 PM PST is 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib httpx python-dotenv

      - name: Run GWS Sync Engine
        env:
          # SECURITY: Inject secrets into memory only
          GWS_MASTER_TOKEN_JSON: ${{ secrets.GWS_MASTER_TOKEN_JSON }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TARGET_EMAIL: ${{ secrets.SLACK_TARGET_EMAIL }}
        run: python sync_engine_cloud.py
