name: GWS Manager Sync Automation

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib httpx python-dotenv

      - name: Run GWS Sync Engine
        env:
          GWS_MASTER_TOKEN_JSON: ${{ secrets.GWS_MASTER_TOKEN_JSON }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TARGET_EMAIL: ${{ secrets.SLACK_TARGET_EMAIL }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TARGET_GROUP: ${{ secrets.TARGET_GROUP }}
        run: python sync_engine_cloud.py